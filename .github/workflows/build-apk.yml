name: Gerar APK Right Price V2.1.8

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java e Node
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extrair exatamente o ZIP V2.1.8
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Right_Price_V2_1_8_CORRECAO_CAMPO_ALIMENTOS.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Não encontrei $ZIP na raiz do repositório. Envie o ZIP V2.1.8 para a raiz do GitHub."
            exit 1
          fi
          rm -rf build-source www android
          mkdir -p build-source www
          unzip -q "$ZIP" -d build-source
          APP="build-source/vsprice"
          test -s "$APP/index.html"
          test -s "$APP/manifest.webmanifest"
          test -s "$APP/service-worker.js"
          test -s "$APP/android-native/SaveFilePickerPlugin.java"
          grep -q 'ALIMENTOS E MATÉRIA-PRIMA CONSUMIDOS NO MÊS' "$APP/index.html" || {
            echo "::error::O ZIP não contém o campo de alimentos V2.1.8."
            exit 1
          }
          cp -a "$APP/." www/
          cat > package.json <<'EOF'
          {
            "name": "right-price",
            "version": "2.1.8",
            "private": true,
            "scripts": {"build": "node -e \"console.log('Arquivos estáticos preservados')\""},
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF
          npm install --no-audit --no-fund
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Registrar seletor nativo de backup
        shell: bash
        run: |
          set -euo pipefail
          JAVA_DIR="android/app/src/main/java/br/com/vilasiria/formacaoprecos"
          mkdir -p "$JAVA_DIR"
          cp build-source/vsprice/android-native/SaveFilePickerPlugin.java "$JAVA_DIR/SaveFilePickerPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package br.com.vilasiria.formacaoprecos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SaveFilePickerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF
          npx cap sync android

      - name: Conferir arquivos web copiados sem alteração
        shell: bash
        run: |
          set -euo pipefail
          cmp build-source/vsprice/index.html www/index.html
          cmp build-source/vsprice/manifest.webmanifest www/manifest.webmanifest
          grep -q 'ALIMENTOS E MATÉRIA-PRIMA CONSUMIDOS NO MÊS' android/app/src/main/assets/public/index.html

      - name: Compilar APK de teste (debug)
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.1.8-APK-DEBUG
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
