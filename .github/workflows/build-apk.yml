name: Right Price V2.3.1 - Gerar APK do ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: right-price-v2-3-1-apk
  cancel-in-progress: false

jobs:
  build:
    name: Extrair ZIP e compilar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar ZIP exato e arquivos necessários
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Right_Price_V2_3_1_CUSTOS_SEM_CAMPO_ALIMENTOS.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: coloque $ZIP na raiz do repositório."
            echo "ZIPs encontrados:"
            find . -type f -iname '*.zip' -print || true
            exit 1
          fi

          python3 - <<'PY'
          import zipfile
          p = "Right_Price_V2_3_1_CUSTOS_SEM_CAMPO_ALIMENTOS.zip"
          required = [
              "vsprice/index.html",
              "vsprice/manifest.webmanifest",
              "vsprice/icons/icon-192.png",
              "vsprice/icons/icon-512.png",
              "vsprice/android-native/SaveFilePickerPlugin.java",
          ]
          try:
              with zipfile.ZipFile(p) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"ERRO: ZIP danificado no arquivo {bad}")
                  names = set(z.namelist())
                  missing = [x for x in required if x not in names]
                  if missing:
                      raise SystemExit("ERRO: ZIP não corresponde à versão esperada. Faltando: " + ", ".join(missing))
                  print("ZIP correto e íntegro.")
          except zipfile.BadZipFile:
              raise SystemExit("ERRO: arquivo não é um ZIP válido.")
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair ZIP e preparar aplicativo Capacitor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf right-price-build
          mkdir -p right-price-build/extracted right-price-build/www

          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("Right_Price_V2_3_1_CUSTOS_SEM_CAMPO_ALIMENTOS.zip") as z:
              z.extractall("right-price-build/extracted")
          PY

          cp -a right-price-build/extracted/vsprice/. right-price-build/www/
          cd right-price-build

          cat > package.json <<'EOF'
          {
            "name": "right-price",
            "version": "2.3.1",
            "private": true,
            "description": "Right Price",
            "dependencies": {
              "@capacitor/android": "6.2.1",
              "@capacitor/core": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Integrar plugin original de backup
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build
          JAVA_DIR="android/app/src/main/java/br/com/vilasiria/formacaoprecos"
          mkdir -p "$JAVA_DIR"

          cp extracted/vsprice/android-native/SaveFilePickerPlugin.java "$JAVA_DIR/SaveFilePickerPlugin.java"

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package br.com.vilasiria.formacaoprecos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePickerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

          test -s "$JAVA_DIR/SaveFilePickerPlugin.java"
          test -s "$JAVA_DIR/MainActivity.java"

      - name: Aplicar nome e ícones originais do ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build

          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re

          source = Path("www/icons/icon-512.png")
          if not source.is_file():
              raise SystemExit("ERRO: ícone original ausente.")
          original = Image.open(source).convert("RGBA")
          res = Path("android/app/src/main/res")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = original.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png")
              icon.save(target / "ic_launcher_round.png")

          # Remover os XML adaptativos padrão, para não substituir o ícone do ZIP.
          adaptive = res / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  f = adaptive / name
                  if f.exists():
                      f.unlink()

          strings = res / "values" / "strings.xml"
          strings.parent.mkdir(parents=True, exist_ok=True)
          if strings.exists():
              content = strings.read_text(encoding="utf-8")
              if re.search(r'<string name="app_name">.*?</string>', content, re.S):
                  content = re.sub(
                      r'<string name="app_name">.*?</string>',
                      '<string name="app_name">Right Price</string>',
                      content, count=1, flags=re.S
                  )
              else:
                  content = content.replace(
                      "</resources>",
                      '    <string name="app_name">Right Price</string>\n</resources>'
                  )
              strings.write_text(content, encoding="utf-8")
          else:
              strings.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                  '    <string name="app_name">Right Price</string>\n</resources>\n',
                  encoding="utf-8"
              )
          PY

      - name: Verificar que o HTML original foi copiado sem alteração
        shell: bash
        run: |
          set -euo pipefail
          cmp right-price-build/extracted/vsprice/index.html right-price-build/www/index.html
          cmp right-price-build/extracted/vsprice/manifest.webmanifest right-price-build/www/manifest.webmanifest
          echo "HTML e manifest copiados sem alteração."

      - name: Compilar APK debug
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build/android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Validar e preparar artefato
        shell: bash
        run: |
          set -euo pipefail
          APK="right-price-build/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            find right-price-build/android -type f -name '*.apk' -print || true
            exit 1
          fi
          unzip -t "$APK" >/dev/null
          mkdir -p output
          cp "$APK" output/Right-Price-V2.3.1-Custos-Sem-Alimentos-debug.apk
          sha256sum output/*.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.3.1-Custos-Sem-Alimentos
          path: output/Right-Price-V2.3.1-Custos-Sem-Alimentos-debug.apk
          if-no-files-found: error
          retention-days: 14
