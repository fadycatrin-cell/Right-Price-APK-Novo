
name: Compilar Right Price V2.4.0

on:
  workflow_dispatch:
  push:
    paths:
      - "Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip"
      - ".github/workflows/build-right-price-v2.4.0.yml"

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK Right Price
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$RUNNER_TEMP/android-sdk"
            mkdir -p "$SDK"
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          if ! find "$SDK/cmdline-tools" \
            -name sdkmanager -type f 2>/dev/null | grep -q .; then

            mkdir -p "$SDK/cmdline-tools"
            cd "$RUNNER_TEMP"

            curl -fL --retry 3 \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -o android-command-tools.zip

            mkdir -p android-cmd-tools
            unzip -q android-command-tools.zip -d android-cmd-tools

            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a android-cmd-tools/cmdline-tools/. \
              "$SDK/cmdline-tools/latest/"
          fi

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK configurado."

      - name: Validar ZIP original
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP original não encontrado na raiz."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/index.html'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/manifest.webmanifest'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/android-native/SaveFilePickerPlugin.java'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/icons/icon-192.png'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/icons/icon-512.png'

      - name: Extrair arquivos originais
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p right-price-build
          unzip -q Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip \
            'vsprice/*' -d right-price-build

          mkdir -p right-price-build/www
          cp -a right-price-build/vsprice/. right-price-build/www/

          test -s right-price-build/www/index.html
          test -s right-price-build/www/manifest.webmanifest

      - name: Criar projeto Android
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          npm init -y

          npm install --save-exact \
            @capacitor/core@6.2.1 \
            @capacitor/android@6.2.1

          npm install --save-dev --save-exact \
            @capacitor/cli@6.2.1

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Integrar plugin de backup
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          PLUGIN="vsprice/android-native/SaveFilePickerPlugin.java"
          JAVA_DIR="android/app/src/main/java/br/com/vilasiria/formacaoprecos"

          test -s "$PLUGIN"
          mkdir -p "$JAVA_DIR"
          cp "$PLUGIN" "$JAVA_DIR/SaveFilePickerPlugin.java"

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package br.com.vilasiria.formacaoprecos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePickerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Configurar nome e versão
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Right Price</string>
              <string name="title_activity_main">Right Price</string>
              <string name="package_name">br.com.vilasiria.formacaoprecos</string>
              <string name="custom_url_scheme">br.com.vilasiria.formacaoprecos</string>
          </resources>
          EOF

          GRADLE="android/app/build.gradle"

          grep -q 'applicationId' "$GRADLE"
          grep -q 'versionCode' "$GRADLE"
          grep -q 'versionName' "$GRADLE"

          sed -i \
            's/applicationId .*/applicationId "br.com.vilasiria.formacaoprecos"/' \
            "$GRADLE"

          sed -i 's/versionCode .*/versionCode 2305/' "$GRADLE"
          sed -i 's/versionName .*/versionName "2.4.0"/' "$GRADLE"

          npx cap sync android

      - name: Restaurar ícones do ZIP
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          ICONS="vsprice/icons"
          RES="android/app/src/main/res"

          for item in \
            "mipmap-ldpi:icon-48.png" \
            "mipmap-mdpi:icon-48.png" \
            "mipmap-hdpi:icon-72.png" \
            "mipmap-xhdpi:icon-96.png" \
            "mipmap-xxhdpi:icon-144.png" \
            "mipmap-xxxhdpi:icon-192.png"
          do
            folder="${item%%:*}"
            file="${item#*:}"

            test -s "$ICONS/$file"
            mkdir -p "$RES/$folder"

            cp "$ICONS/$file" "$RES/$folder/ic_launcher.png"
            cp "$ICONS/$file" "$RES/$folder/ic_launcher_round.png"
          done

      - name: Conferir arquivos antes da compilação
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          test -s www/index.html
          test -s www/manifest.webmanifest
          test -s android/gradlew
          test -s android/app/src/main/java/br/com/vilasiria/formacaoprecos/SaveFilePickerPlugin.java
          test -s android/app/src/main/java/br/com/vilasiria/formacaoprecos/MainActivity.java

      - name: Compilar APK sem senha
        shell: bash
        working-directory: right-price-build/android
        run: |
          set -euo pipefail

          chmod +x gradlew

          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          ./gradlew --no-daemon clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          mkdir -p ../apk-final
          cp "$APK" ../apk-final/Right-Price-V2.4.0.apk

      - name: Verificar assinatura
        shell: bash
        working-directory: right-price-build/android
        run: |
          set -euo pipefail

          APK="../apk-final/Right-Price-V2.4.0.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          test -x "$APKSIGNER"
          "$APKSIGNER" verify "$APK"

          sha256sum "$APK"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.4.0-APK
          path: right-price-build/apk-final/Right-Price-V2.4.0.apk
          if-no-files-found: error
          retention-days: 14
