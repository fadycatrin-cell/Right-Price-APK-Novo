name: Gerar APK Right Price 2.37

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Gerar somente o APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos da versão 2.37
        shell: bash
        run: |
          set -euo pipefail
          test -f vsprice/index.html || { echo 'ERRO: não encontrei vsprice/index.html. Extraia a pasta vsprice da versão Right_Price_AUDITORIA_FINAL_V2_37.zip para a raiz do repositório.'; exit 1; }
          test -f vsprice/manifest.webmanifest
          test -f vsprice/icons/icon-512.png
          grep -q 'const VERSION=2.37' vsprice/index.html || { echo 'ERRO: o index.html não parece ser a versão 2.37. Nenhuma alteração foi feita no aplicativo.'; exit 1; }
          test -f vsprice/signing/vila-siria-update.jks || { echo 'ERRO: a chave original vila-siria-update.jks não está no projeto.'; exit 1; }

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar ferramentas Android
        uses: android-actions/setup-android@v3

      - name: Preparar projeto nativo sem alterar os arquivos do aplicativo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www assets
          rsync -a --exclude="signing/" --exclude="android-native/" vsprice/ www/
          cp vsprice/icons/icon-512.png assets/icon.png
          cp vsprice/icons/icon-512.png assets/splash.png
          cat > package.json <<'JSON'
          {
            "name": "right-price-android-build",
            "version": "2.37.0",
            "private": true,
            "description": "Build Android wrapper for Right Price 2.37",
            "scripts": {
              "build": "echo 'Arquivos web copiados sem compilação ou transformação'"
            },
            "dependencies": {
              "@capacitor/core": "7.4.3",
              "@capacitor/android": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3",
              "@capacitor/assets": "3.0.5"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Configurar versão e assinatura original
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ERRO: configure o GitHub Secret ANDROID_KEYSTORE_PASSWORD.'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ERRO: configure o GitHub Secret ANDROID_KEY_PASSWORD.'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ERRO: configure o GitHub Secret ANDROID_KEY_ALIAS.'; exit 1; }
          mkdir -p android/app/keystore
          cp vsprice/signing/vila-siria-update.jks android/app/keystore/vila-siria-update.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle')
          s = p.read_text()

          if 'signingConfigs {' not in s:
              signing = '''    signingConfigs {
          release {
              storeFile file("keystore/vila-siria-update.jks")
              storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
              keyAlias System.getenv("ANDROID_KEY_ALIAS")
              keyPassword System.getenv("ANDROID_KEY_PASSWORD")
          }
      }

      '''
              s = s.replace('    buildTypes {', signing + '    buildTypes {', 1)

          if re.search(r'\\bversionCode\\s+\\d+', s):
              s = re.sub(r'\\bversionCode\\s+\\d+', 'versionCode 237', s, count=1)
          else:
              s = s.replace('defaultConfig {', 'defaultConfig {\\n        versionCode 237', 1)

          if re.search(r'\\bversionName\\s+"[^"]*"', s):
              s = re.sub(r'\\bversionName\\s+"[^"]*"', 'versionName "2.37"', s, count=1)
          else:
              s = s.replace('defaultConfig {', 'defaultConfig {\\n        versionName "2.37"', 1)

          if 'signingConfig signingConfigs.release' not in s:
              before, after = s.split('buildTypes {', 1)
              after = after.replace('release {', 'release {\\n            signingConfig signingConfigs.release', 1)
              s = before + 'buildTypes {' + after

          p.write_text(s)
          PY

      - name: Gerar APK Release assinado
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Publicar somente o APK
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.37-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
