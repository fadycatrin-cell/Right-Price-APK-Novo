
name: Right Price V2.4.0 - Gerar APK sem alterar o app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node e Java
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validar ZIP original
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip"
          test -f "$ZIP" || {
            echo "::error::Coloque o ZIP V2.4.0 na raiz do repositorio."
            exit 1
          }

          python3 - <<'PY'
          import zipfile
          p = "Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip"
          with zipfile.ZipFile(p) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP danificado: {bad}")
              required = [
                  "vsprice/index.html",
                  "vsprice/manifest.webmanifest",
                  "vsprice/icons/icon-192.png",
                  "vsprice/icons/icon-512.png",
                  "vsprice/android-native/SaveFilePickerPlugin.java",
                  "vsprice/signing/vila-siria-update.jks",
              ]
              missing = [x for x in required if x not in z.namelist()]
              if missing:
                  raise SystemExit("Arquivos ausentes: " + ", ".join(missing))
          print("ZIP validado.")
          PY

      - name: Extrair arquivos originais sem modificar o app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf right-price-build
          mkdir -p right-price-build
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip") as z:
              z.extractall("right-price-build/source")
          PY

          mkdir -p right-price-build/www
          cp -a right-price-build/source/vsprice/. right-price-build/www/
          cp right-price-build/source/vsprice/signing/vila-siria-update.jks right-price-build/vila-siria-update.jks

          cd right-price-build
          cat > package.json <<'JSON'
          {
            "name": "right-price",
            "version": "2.4.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          JSON

          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Conferir se os arquivos do aplicativo foram preservados
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build

          cmp source/vsprice/index.html www/index.html
          cmp source/vsprice/manifest.webmanifest www/manifest.webmanifest

          for f in source/vsprice/icons/*.png; do
            cmp "$f" "www/icons/$(basename "$f")"
          done

          cmp source/vsprice/android-native/SaveFilePickerPlugin.java \
              source/vsprice/android-native/SaveFilePickerPlugin.java

          echo "Arquivos originais conferidos sem alteracoes."

      - name: Integrar plugin de backup original
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build

          JAVA_DIR="android/app/src/main/java/br/com/vilasiria/formacaoprecos"
          mkdir -p "$JAVA_DIR"

          cp source/vsprice/android-native/SaveFilePickerPlugin.java "$JAVA_DIR/"

          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.vilasiria.formacaoprecos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePickerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Configurar nome e versao Android
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/res")
          strings = root / "values/strings.xml"
          content = strings.read_text(encoding="utf-8")

          if re.search(r'<string name="app_name">.*?</string>', content, re.S):
              content = re.sub(
                  r'<string name="app_name">.*?</string>',
                  '<string name="app_name">Right Price</string>',
                  content,
                  count=1,
                  flags=re.S
              )
          else:
              content = content.replace(
                  "</resources>",
                  '<string name="app_name">Right Price</string>\n</resources>'
              )

          strings.write_text(content, encoding="utf-8")

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")

          if not re.search(r'versionCode\s+\d+', g):
              raise SystemExit("versionCode nao encontrado.")
          if not re.search(r'versionName\s+"[^"]+"', g):
              raise SystemExit("versionName nao encontrado.")

          g = re.sub(r'versionCode\s+\d+', 'versionCode 2305', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.4.0"', g, count=1)
          gradle.write_text(g, encoding="utf-8")
          PY

          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          cp www/icons/icon-192.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp www/icons/icon-192.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp www/icons/icon-192.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp www/icons/icon-192.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp www/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build/android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Assinar APK com chave original
        shell: bash
        env:
          KS_PASS: ${{ secrets.RIGHT_PRICE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.RIGHT_PRICE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd right-price-build

          test -s vila-siria-update.jks || {
            echo "::error::Chave original ausente."
            exit 1
          }

          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK" || {
            echo "::error::APK nao encontrado."
            find android/app/build/outputs -type f -name '*.apk' -print
            exit 1
          }

          test -n "$KS_PASS" || {
            echo "::error::Configure o segredo RIGHT_PRICE_KEYSTORE_PASSWORD no GitHub."
            exit 1
          }
          test -n "$KEY_PASS" || {
            echo "::error::Configure o segredo RIGHT_PRICE_KEY_PASSWORD no GitHub."
            exit 1
          }

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$BUILD_TOOLS/zipalign" -f -v 4 "$APK" right-price-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks vila-siria-update.jks \
            --ks-key-alias vila-siria \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out Right-Price-V2.4.0.apk \
            right-price-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose Right-Price-V2.4.0.apk
          unzip -t Right-Price-V2.4.0.apk >/dev/null
          sha256sum Right-Price-V2.4.0.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.4.0-APK
          path: right-price-build/Right-Price-V2.4.0.apk
          if-no-files-found: error
          retention-days: 14
