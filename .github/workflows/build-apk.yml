name: Right Price - Gerar APK V2.1.6

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: right-price-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos encontrados na raiz:"
          ls -la

          if [ -f gradlew ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f android/gradlew ]; then
            echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
          else
            echo "ERRO: gradlew não encontrado na raiz nem em android/."
            echo "Confira se o repositório contém o projeto Android completo."
            exit 1
          fi

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      - name: Compilar APK de release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/right-price-apk"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} "$RUNNER_TEMP/right-price-apk/" \;

          if ! find "$RUNNER_TEMP/right-price-apk" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "ERRO: nenhum APK de release foi gerado."
            exit 1
          fi

          for APK in "$RUNNER_TEMP"/right-price-apk/*.apk; do
            unzip -t "$APK" >/dev/null
          done

      - name: Publicar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.1.6-APK
          path: ${{ runner.temp }}/right-price-apk/*.apk
          if-no-files-found: error
          retention-days: 14
