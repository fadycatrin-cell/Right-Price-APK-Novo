
name: Gerar APK Right Price V2.4.0

on:
  workflow_dispatch:
  push:
    paths:
      - "Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip"
      - ".github/workflows/build-right-price-v2.4.0.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar Right Price
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ""

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Validar ZIP original
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::Não encontrei $ZIP na raiz do repositório."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/index.html'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/manifest.webmanifest'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/android-native/SaveFilePickerPlugin.java'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/icons/icon-192.png'
          unzip -Z1 "$ZIP" | grep -qx 'vsprice/icons/icon-512.png'

      - name: Extrair arquivos originais sem modificar o aplicativo
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p right-price-build
          unzip -q Right_Price_V2_4_0_MARKUP_SIMPLIFICADO.zip \
            'vsprice/*' -d right-price-build

          mkdir -p right-price-build/www
          cp -a right-price-build/vsprice/. right-price-build/www/

          test -s right-price-build/www/index.html
          test -s right-price-build/www/manifest.webmanifest
          test -s right-price-build/www/service-worker.js

          sha256sum right-price-build/www/index.html

      - name: Conferir e preservar os arquivos web
        shell: bash
        run: |
          set -euo pipefail

          test -s right-price-build/www/index.html
          test -s right-price-build/www/icons/icon-192.png
          test -s right-price-build/www/icons/icon-512.png

          echo "Arquivos originais do aplicativo preservados."

      - name: Criar configuração Android
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          npm init -y
          npm install --save-exact \
            @capacitor/core@6.2.1 \
            @capacitor/android@6.2.1
          npm install --save-dev --save-exact \
            @capacitor/cli@6.2.1

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Integrar plugin original de backup
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          PLUGIN="vsprice/android-native/SaveFilePickerPlugin.java"
          JAVA_DIR="android/app/src/main/java/br/com/vilasiria/formacaoprecos"

          test -s "$PLUGIN"
          mkdir -p "$JAVA_DIR"
          cp "$PLUGIN" "$JAVA_DIR/SaveFilePickerPlugin.java"

          cat > "$JAVA_DIR/MainActivity.java" <<'EOF'
          package br.com.vilasiria.formacaoprecos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePickerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Configurar nome, versão e ícones
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          STRINGS="android/app/src/main/res/values/strings.xml"

          cat > "$STRINGS" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Right Price</string>
              <string name="title_activity_main">Right Price</string>
              <string name="package_name">br.com.vilasiria.formacaoprecos</string>
              <string name="custom_url_scheme">br.com.vilasiria.formacaoprecos</string>
          </resources>
          EOF

          GRADLE="android/app/build.gradle"

          if [ ! -f "$GRADLE" ]; then
            echo "::error::Arquivo android/app/build.gradle não encontrado."
            exit 1
          fi

          sed -i \
            's/applicationId .*/applicationId "br.com.vilasiria.formacaoprecos"/' \
            "$GRADLE"

          sed -i \
            's/versionCode .*/versionCode 2305/' \
            "$GRADLE"

          sed -i \
            's/versionName .*/versionName "2.4.0"/' \
            "$GRADLE"

          ICONS="vsprice/icons"
          RES="android/app/src/main/res"

          for item in \
            "mipmap-ldpi:icon-48.png" \
            "mipmap-mdpi:icon-48.png" \
            "mipmap-hdpi:icon-72.png" \
            "mipmap-xhdpi:icon-96.png" \
            "mipmap-xxhdpi:icon-144.png" \
            "mipmap-xxxhdpi:icon-192.png"
          do
            folder="${item%%:*}"
            file="${item#*:}"

            mkdir -p "$RES/$folder"
            cp "$ICONS/$file" "$RES/$folder/ic_launcher.png"
            cp "$ICONS/$file" "$RES/$folder/ic_launcher_round.png"
          done

          npx cap sync android

      - name: Verificar arquivos antes da compilação
        shell: bash
        working-directory: right-price-build
        run: |
          set -euo pipefail

          test -s www/index.html
          test -s www/service-worker.js
          test -s android/app/src/main/java/br/com/vilasiria/formacaoprecos/SaveFilePickerPlugin.java
          test -s android/app/src/main/java/br/com/vilasiria/formacaoprecos/MainActivity.java

          grep -q 'applicationId "br.com.vilasiria.formacaoprecos"' \
            android/app/build.gradle

          grep -q 'versionName "2.4.0"' android/app/build.gradle

      - name: Compilar APK sem senha
        shell: bash
        working-directory: right-price-build/android
        run: |
          set -euo pipefail

          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::A compilação terminou sem produzir o APK."
            exit 1
          fi

          mkdir -p ../apk-final
          cp "$APK" ../apk-final/Right-Price-V2.4.0.apk

      - name: Verificar assinatura automática do APK
        shell: bash
        working-directory: right-price-build/android
        run: |
          set -euo pipefail

          APK="../apk-final/Right-Price-V2.4.0.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Ferramenta apksigner não encontrada."
            exit 1
          fi

          "$APKSIGNER" verify "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.4.0-APK
          path: right-price-build/apk-final/Right-Price-V2.4.0.apk
          if-no-files-found: error
          retention-days: 14
