name: Gerar APK Right Price V2.1.7

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar arquivos do Right Price V2.1.7
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Right_Price_V2_1_7_MOTOR_PRECOS_CORRIGIDO.zip"
          test -f "$ZIP" || { echo "::error::Coloque $ZIP na raiz do repositório."; exit 1; }
          mkdir -p work
          unzip -q "$ZIP" -d work
          test -f work/vsprice/index.html
          mkdir -p www
          cp -R work/vsprice/. www/
          cat > package.json <<'EOF'
          {
            "name": "right-price",
            "version": "2.1.7",
            "private": true,
            "description": "Right Price - formação de preços",
            "scripts": { "build": "echo Static web assets ready" },
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          EOF
          npm install
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false,
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Integrar plugin de backup com seletor de armazenamento Android
        shell: bash
        run: |
          set -euo pipefail
          SRC="work/vsprice/android-native/SaveFilePickerPlugin.java"
          DEST="android/app/src/main/java/br/com/vilasiria/formacaoprecos/SaveFilePickerPlugin.java"
          test -f "$SRC"
          mkdir -p "$(dirname "$DEST")"
          cp "$SRC" "$DEST"
          MAIN="android/app/src/main/java/br/com/vilasiria/formacaoprecos/MainActivity.java"
          cat > "$MAIN" <<'EOF'
          package br.com.vilasiria.formacaoprecos;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SaveFilePickerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          EOF

      - name: Configurar assinatura do APK
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="work/vsprice/signing/vila-siria-update.jks"
          test -f "$KEYSTORE" || { echo "::error::Keystore original não encontrado no ZIP."; exit 1; }
          mkdir -p android/app
          cp "$KEYSTORE" android/app/vila-siria-update.jks
          cat >> android/gradle.properties <<EOF
          RIGHTPRICE_STORE_FILE=vila-siria-update.jks
          RIGHTPRICE_STORE_PASSWORD=${KEYSTORE_PASSWORD}
          RIGHTPRICE_KEY_ALIAS=vila-siria
          RIGHTPRICE_KEY_PASSWORD=${KEY_PASSWORD}
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          if marker not in s:
              raise SystemExit("Não foi possível localizar o bloco buildTypes do Gradle.")
          signing = """    signingConfigs {
                  release {
                      storeFile file(project.findProperty('RIGHTPRICE_STORE_FILE') ?: 'vila-siria-update.jks')
                      storePassword project.findProperty('RIGHTPRICE_STORE_PASSWORD')
                      keyAlias project.findProperty('RIGHTPRICE_KEY_ALIAS') ?: 'vila-siria'
                      keyPassword project.findProperty('RIGHTPRICE_KEY_PASSWORD')
                  }
              }

          """
          if "RIGHTPRICE_STORE_FILE" not in s:
              s = s.replace(marker, signing + marker, 1)
          s = s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY

      - name: Gerar APK de release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Publicar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.1.7-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
