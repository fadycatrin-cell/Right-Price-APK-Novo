name: Right Price V2.3.2 - Gerar APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: right-price-v2-3-2-apk
  cancel-in-progress: false

jobs:
  build:
    name: Validar versão, preservar identidade e compilar APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Validar ZIP exato e íntegro
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Right_Price_V2_3_2_RATEIO_CUSTOS_AUDITADO.zip"
          test -f "$ZIP" || { echo "::error::Coloque $ZIP na raiz do repositório."; find . -maxdepth 2 -type f -iname '*.zip' -print || true; exit 1; }
          python3 - <<'PY'
          import zipfile
          p = "Right_Price_V2_3_2_RATEIO_CUSTOS_AUDITADO.zip"
          required = [
              "vsprice/index.html",
              "vsprice/manifest.webmanifest",
              "vsprice/icons/icon-192.png",
              "vsprice/icons/icon-512.png",
              "vsprice/android-native/SaveFilePickerPlugin.java",
              "vsprice/signing/vila-siria-update.jks",
          ]
          try:
              with zipfile.ZipFile(p) as z:
                  bad = z.testzip()
                  if bad:
                      raise SystemExit(f"::error::ZIP danificado: {bad}")
                  names = set(z.namelist())
                  missing = [x for x in required if x not in names]
                  if missing:
                      raise SystemExit("::error::ZIP não corresponde à versão esperada; faltam: " + ", ".join(missing))
          except zipfile.BadZipFile:
              raise SystemExit("::error::Arquivo inválido: não é um ZIP íntegro.")
          print("ZIP da V2.3.2 validado.")
          PY

      - name: Configurar Node.js e Java
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair os arquivos originais e preparar Capacitor
        shell: bash
        run: |
          set -euo pipefail
          rm -rf right-price-build
          mkdir -p right-price-build/extracted right-price-build/www
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("Right_Price_V2_3_2_RATEIO_CUSTOS_AUDITADO.zip") as z:
              z.extractall("right-price-build/extracted")
          PY
          cp -a right-price-build/extracted/vsprice/. right-price-build/www/
          cp right-price-build/extracted/vsprice/signing/vila-siria-update.jks right-price-build/vila-siria-update.jks
          cd right-price-build
          cat > package.json <<'JSON'
          {
            "name": "right-price",
            "version": "2.3.2",
            "private": true,
            "description": "Right Price",
            "dependencies": {
              "@capacitor/android": "6.2.1",
              "@capacitor/core": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          JSON
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          JSON
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Integrar plugin de backup original
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build
          JAVA_DIR="android/app/src/main/java/br/com/vilasiria/formacaoprecos"
          mkdir -p "$JAVA_DIR"
          cp extracted/vsprice/android-native/SaveFilePickerPlugin.java "$JAVA_DIR/SaveFilePickerPlugin.java"
          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package br.com.vilasiria.formacaoprecos;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(SaveFilePickerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          test -s "$JAVA_DIR/SaveFilePickerPlugin.java"
          test -s "$JAVA_DIR/MainActivity.java"

      - name: Aplicar nome, ícone e versão sem alterar os arquivos web
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          import re
          res = Path("android/app/src/main/res")
          icon_path = Path("www/icons/icon-512.png")
          if not icon_path.is_file():
              raise SystemExit("::error::Ícone original ausente.")
          original = Image.open(icon_path).convert("RGBA")
          for folder, size in {
              "mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96,
              "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192
          }.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              img = original.resize((size, size), Image.Resampling.LANCZOS)
              img.save(target / "ic_launcher.png")
              img.save(target / "ic_launcher_round.png")
          adaptive = res / "mipmap-anydpi-v26"
          if adaptive.exists():
              for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
                  f = adaptive / name
                  if f.exists(): f.unlink()
          strings = res / "values/strings.xml"
          strings.parent.mkdir(parents=True, exist_ok=True)
          content = strings.read_text(encoding="utf-8") if strings.exists() else "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n</resources>\n"
          if re.search(r'<string name="app_name">.*?</string>', content, re.S):
              content = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">Right Price</string>', content, count=1, flags=re.S)
          else:
              content = content.replace("</resources>", "    <string name=\"app_name\">Right Price</string>\n</resources>")
          strings.write_text(content, encoding="utf-8")
          gradle = Path("android/app/build.gradle")
          g = gradle.read_text(encoding="utf-8")
          if not re.search(r'versionCode\s+\d+', g) or not re.search(r'versionName\s+"[^"]+"', g):
              raise SystemExit("::error::Não foi possível localizar versionCode/versionName no build.gradle.")
          g = re.sub(r'versionCode\s+\d+', 'versionCode 2302', g, count=1)
          g = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.3.2"', g, count=1)
          gradle.write_text(g, encoding="utf-8")
          PY
          cmp extracted/vsprice/index.html www/index.html
          cmp extracted/vsprice/manifest.webmanifest www/manifest.webmanifest
          echo "HTML, manifest, nome e ícone verificados."

      - name: Compilar APK release
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build/android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Assinar com a chave original e validar APK
        shell: bash
        run: |
          set -euo pipefail
          cd right-price-build
          # Mantém o mesmo método de assinatura usado no gerador anterior do Right Price.
          KEYSTORE="vila-siria-update.jks"
          KEYSTORE_PASSWORD="VSFormacao2026"
          KEY_PASSWORD="VSFormacao2026"
          test -s "$KEYSTORE" || { echo "::error::Chave original .jks ausente."; exit 1; }
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -s "$UNSIGNED" ]; then
            echo "::error::APK release unsigned não encontrado; arquivos encontrados:"
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS" || { echo "::error::Android Build Tools não encontrados."; exit 1; }
          "$BUILD_TOOLS/zipalign" -f -v 4 "$UNSIGNED" right-price-aligned.apk
          export KS_PASS="$KEYSTORE_PASSWORD"
          export KEY_PASS="$KEY_PASSWORD"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias vila-siria \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out Right-Price-V2.3.2-Rateio-Custos.apk \
            right-price-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose Right-Price-V2.3.2-Rateio-Custos.apk
          unzip -t Right-Price-V2.3.2-Rateio-Custos.apk >/dev/null
          sha256sum Right-Price-V2.3.2-Rateio-Custos.apk
          rm -f right-price-aligned.apk

      - name: Disponibilizar somente o APK final
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.3.2-APK
          path: right-price-build/Right-Price-V2.3.2-Rateio-Custos.apk
          if-no-files-found: error
          retention-days: 14
