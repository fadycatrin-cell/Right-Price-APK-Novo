name: Right Price V2.3.1 — APK Debug sem senha

on:
  workflow_dispatch:

# Este workflow gera APK Debug e NÃO usa keystore, senha ou Secrets do GitHub.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extrair projeto corrigido
        shell: bash
        run: |
          set -euo pipefail
          ZIP="Right_Price_V2_3_1_MOTOR_PRECOS_AUDITADO.zip"
          test -f "$ZIP" || { echo "::error::Coloque $ZIP na raiz do repositório."; exit 1; }
          rm -rf rp-source www android
          mkdir -p rp-source www
          unzip -q "$ZIP" -d rp-source
          APP="rp-source/vsprice"
          test -s "$APP/index.html"
          test -s "$APP/manifest.webmanifest"
          test -s "$APP/service-worker.js"
          test -s "$APP/android-native/SaveFilePickerPlugin.java"
          grep -q 'function fixedExpensePct' "$APP/index.html"
          grep -q 'function variableExpensePct' "$APP/index.html"
          if grep -q 'Custos fixos não entram no divisor por produto' "$APP/index.html"; then
            echo "::error::Texto antigo do motor de preços encontrado."; exit 1
          fi
          cp -a "$APP/." www/
          cat > package.json <<'PKG'
          {
            "name": "right-price",
            "version": "2.3.1",
            "private": true,
            "dependencies": {
              "@capacitor/core": "6.2.1",
              "@capacitor/android": "6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "6.2.1"
            }
          }
          PKG
          npm install --no-audit --no-fund
          cat > capacitor.config.json <<'CAP'
          {
            "appId": "br.com.vilasiria.formacaoprecos",
            "appName": "Right Price",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          CAP
          npx cap add android
          npx cap sync android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+', 'versionCode 231', s, count=1)
          s=re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "2.3.1"', s, count=1)
          p.write_text(s)
          PY

      - name: Aplicar ícones originais do ZIP
        shell: bash
        run: |
          set -euo pipefail
          SRC="rp-source/vsprice/icons"
          RES="android/app/src/main/res"
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi"
          cp "$SRC/icon-48.png" "$RES/mipmap-mdpi/ic_launcher.png"
          cp "$SRC/icon-48.png" "$RES/mipmap-mdpi/ic_launcher_round.png"
          cp "$SRC/icon-72.png" "$RES/mipmap-hdpi/ic_launcher.png"
          cp "$SRC/icon-72.png" "$RES/mipmap-hdpi/ic_launcher_round.png"
          cp "$SRC/icon-96.png" "$RES/mipmap-xhdpi/ic_launcher.png"
          cp "$SRC/icon-96.png" "$RES/mipmap-xhdpi/ic_launcher_round.png"
          cp "$SRC/icon-144.png" "$RES/mipmap-xxhdpi/ic_launcher.png"
          cp "$SRC/icon-144.png" "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          cp "$SRC/icon-192.png" "$RES/mipmap-xxxhdpi/ic_launcher.png"
          cp "$SRC/icon-192.png" "$RES/mipmap-xxxhdpi/ic_launcher_round.png"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Registrar o recurso nativo de backup
        shell: bash
        run: |
          set -euo pipefail
          DEST="android/app/src/main/java/br/com/vilasiria/formacaoprecos"
          mkdir -p "$DEST"
          cp rp-source/vsprice/android-native/SaveFilePickerPlugin.java "$DEST/SaveFilePickerPlugin.java"
          cat > "$DEST/MainActivity.java" <<'JAVA'
          package br.com.vilasiria.formacaoprecos;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(SaveFilePickerPlugin.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          npx cap sync android
          cp rp-source/vsprice/icons/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp rp-source/vsprice/icons/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp rp-source/vsprice/icons/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp rp-source/vsprice/icons/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp rp-source/vsprice/icons/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp rp-source/vsprice/icons/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp rp-source/vsprice/icons/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp rp-source/vsprice/icons/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp rp-source/vsprice/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp rp-source/vsprice/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

      - name: Gerar APK instalável sem keystore nem segredos
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Right-Price-V2.3.1.apk
          cd ..
          test -s Right-Price-V2.3.1.apk

      - name: Disponibilizar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.3.1-APK-Instalavel
          path: Right-Price-V2.3.1.apk
          if-no-files-found: error
