name: Right Price - Gerar APK V2.1.6

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: right-price-build
  cancel-in-progress: false

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f android/gradlew ]; then
            echo "PROJECT_DIR=android" >> "$GITHUB_ENV"
          else
            echo "ERRO: gradlew não encontrado."
            echo "Confira se o ZIP contém o projeto Android completo."
            exit 1
          fi

      - name: Preparar Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      - name: Compilar APK de release
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Localizar e validar APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/right-price-apk"

          find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/release/*.apk' \
            -exec cp {} "$RUNNER_TEMP/right-price-apk/" \;

          APK_COUNT=$(find "$RUNNER_TEMP/right-price-apk" \
            -maxdepth 1 -type f -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERRO: nenhum APK de release foi gerado."
            exit 1
          fi

          for APK in "$RUNNER_TEMP"/right-price-apk/*.apk; do
            if [ ! -s "$APK" ]; then
              echo "ERRO: APK vazio: $APK"
              exit 1
            fi

            if ! unzip -t "$APK" >/dev/null; then
              echo "ERRO: APK inválido: $APK"
              exit 1
            fi
          done

      - name: Publicar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: Right-Price-V2.1.6-APK
          path: ${{ runner.temp }}/right-price-apk/*.apk
          if-no-files-found: error
          retention-days: 14
